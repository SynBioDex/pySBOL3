[build-system]
requires = ["setuptools>=80.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbol3"
version = "1.3.0"
description = "Python implementation of SBOL 3 standard"
readme = "README.md"
authors = [{name = "Tom Mitchell"}, {email = "tcmitchell@users.noreply.github.com"}]
license = {text = "MIT License"}
requires-python = ">=3.11"
keywords = ["synthetic biology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Keep rdflib at 7.0 because it has an internal deprecation warning with JSON-LD handling.
    # See https://github.com/RDFLib/rdflib/issues/3064
    "rdflib<7.1",
    "python-dateutil",
    "pyshacl",
]

[project.urls]
homepage = "https://github.com/SynBioDex/pySBOL3"

[dependency-groups]
# Dependencies for unit tests. To load this into your venv do
#     python3 -m pip install --group dev -e .
# OR
#     uv sync --group dev
dev = [
    "coverage",
    "pycodestyle",
    "pylint",
    "ruff",
]

[tool.setuptools]
packages = ["sbol3", "sbol3.rdf"]

[tool.pytest.ini_options]
testpath = ["test"]

